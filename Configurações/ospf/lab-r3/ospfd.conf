frr defaults traditional
hostname R3
log syslog informational
!
interface lan0
 ip ospf cost 1
 ip ospf passive
!
interface r3-r1
 ip ospf network point-to-point
 ip ospf cost 10
!
interface r3-r4
 ip ospf network point-to-point
 ip ospf cost 10
!
router ospf
 ospf router-id 1.1.1.3
 network 10.0.0.0/8 area 0.0.0.0
 network 192.168.3.0/24 area 0.0.0.0
 maximum-paths 1
!

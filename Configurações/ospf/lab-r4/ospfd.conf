frr defaults traditional
hostname R4
log syslog informational
!
interface lan0
 ip ospf cost 1
 ip ospf passive
!
interface r4-r2
 ip ospf network point-to-point
 ip ospf cost 10
!
interface r4-r3
 ip ospf network point-to-point
 ip ospf cost 10
!
interface r4-r5
 ip ospf network point-to-point
 ip ospf cost 10
!
router ospf
 ospf router-id 1.1.1.4
 network 10.0.0.0/8 area 0.0.0.0
 network 192.168.4.0/24 area 0.0.0.0
 maximum-paths 1
!

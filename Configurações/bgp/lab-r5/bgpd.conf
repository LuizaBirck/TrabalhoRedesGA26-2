frr defaults traditional
hostname R5
log syslog informational
!
ip prefix-list LAB-LANS seq 10 permit 192.168.1.0/24
ip prefix-list LAB-LANS seq 20 permit 192.168.2.0/24
ip prefix-list LAB-LANS seq 30 permit 192.168.3.0/24
ip prefix-list LAB-LANS seq 40 permit 192.168.4.0/24
ip prefix-list LAB-LANS seq 50 permit 192.168.5.0/24
!
route-map LAB-PERMIT permit 10
 match ip address prefix-list LAB-LANS
!
router bgp 65003
 bgp router-id 1.1.1.5
 bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 10.0.45.1 remote-as 65002
 neighbor 10.0.25.1 remote-as 65001
 address-family ipv4 unicast
  network 192.168.5.0/24
  neighbor 10.0.45.1 activate
  neighbor 10.0.45.1 next-hop-self
  neighbor 10.0.45.1 route-map LAB-PERMIT in
  neighbor 10.0.45.1 route-map LAB-PERMIT out
  neighbor 10.0.25.1 activate
  neighbor 10.0.25.1 next-hop-self
  neighbor 10.0.25.1 route-map LAB-PERMIT in
  neighbor 10.0.25.1 route-map LAB-PERMIT out
 exit-address-family
!

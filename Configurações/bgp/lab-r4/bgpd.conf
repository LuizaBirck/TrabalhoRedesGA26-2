frr defaults traditional
hostname R4
log syslog informational
!
ip prefix-list LAB-LANS seq 10 permit 192.168.1.0/24
ip prefix-list LAB-LANS seq 20 permit 192.168.2.0/24
ip prefix-list LAB-LANS seq 30 permit 192.168.3.0/24
ip prefix-list LAB-LANS seq 40 permit 192.168.4.0/24
ip prefix-list LAB-LANS seq 50 permit 192.168.5.0/24
!
route-map LAB-PERMIT permit 10
 match ip address prefix-list LAB-LANS
!
router bgp 65002
 bgp router-id 1.1.1.4
 bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 10.0.24.1 remote-as 65001
 neighbor 10.0.34.1 remote-as 65002
 neighbor 10.0.45.2 remote-as 65003
 address-family ipv4 unicast
  network 192.168.4.0/24
  neighbor 10.0.24.1 activate
  neighbor 10.0.24.1 next-hop-self
  neighbor 10.0.24.1 route-map LAB-PERMIT in
  neighbor 10.0.24.1 route-map LAB-PERMIT out
  neighbor 10.0.34.1 activate
  neighbor 10.0.34.1 next-hop-self
  neighbor 10.0.34.1 route-map LAB-PERMIT in
  neighbor 10.0.34.1 route-map LAB-PERMIT out
  neighbor 10.0.45.2 activate
  neighbor 10.0.45.2 next-hop-self
  neighbor 10.0.45.2 route-map LAB-PERMIT in
  neighbor 10.0.45.2 route-map LAB-PERMIT out
 exit-address-family
!
